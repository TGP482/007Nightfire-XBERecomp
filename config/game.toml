# sprite batch lists take their space off the heap's end (src/game/out_of_memory.cpp)
[[hook]]
at = 0x70A72
call = "ReserveBatchLists"

# the gadgets recharge on a 60 fps clock (src/game/gadget_recharge.cpp)
[[hook]]
at = 0xADA5C
call = "GadgetRecharge"
on_true = 0xADB97

# crouched and slowed walks settle at their 60 fps speed (src/game/movement.cpp)
[[hook]]
at = 0xAA024
call = "WalkSpeed"
on_true = 0xAA048

# the grapple pulls and times out as at 60 fps (src/game/movement.cpp)
[[hook]]
at = 0xAA4A9
call = "GrapplePull"
on_true = 0xAA4F2

[[hook]]
at = 0xAA334
call = "GrappleStartTime"

# the mouse turns a guided missile (src/game/mouse.cpp)
[[hook]]
at = 0x23838
call = "GuidedMissileMouse"

# an animation change with every layer taken skips its blend (src/game/frame_rate.cpp)
[[hook]]
at = 0x33F86
call = "SkipBlendWithoutLayer"
on_true = 0x33FC3

# the ammo panel shows a new weapon's name for a second at any frame rate (src/game/ammo_counter.cpp)
[[hook]]
at = 0xB231A
call = "AmmoNameStart"
on_true = 0xB232F

[[hook]]
at = 0xB2341
call = "AmmoNameStep"
on_true = 0xB2349

# a level timer's delay is made in console frames (src/game/level_timers.cpp)
[[hook]]
at = 0x2011A
call = "TimerDelayFrames"
on_true = 0x20120

# a door with no open time opens in a second of console frames (src/game/doors.cpp)
[[hook]]
at = 0x2F6D9
call = "DoorDefaultOpenTime"

# a helicopter flies its path at its 60 fps speed (src/game/helicopter.cpp)
[[hook]]
at = 0x6BC68
call = "HelicopterPathStep"
on_true = 0x6BC7C
on_false = 0x6BC8F

# its gun, muzzle flash and start delay count 60 fps frames (src/game/helicopter.cpp)
[[hook]]
at = 0x6C003
call = "HelicopterStartDelay"
on_true = 0x6C031
on_false = 0x6C00D

[[hook]]
at = 0x6C035
call = "HelicopterFlash"
on_true = 0x6C04B

[[hook]]
at = 0x6BD77
call = "HelicopterGunCount"
on_true = 0x6BE5E
on_false = 0x6BD87

# triggered scenery animations play at their 60 fps speed (src/game/scenery_animations.cpp)
[[hook]]
at = 0x6C7B4
call = "TriggeredAnimationStep"
on_true = 0x6C7B9

# debris shards fade and spin at their 60 fps speed (src/game/debris.cpp)
[[hook]]
at = 0xCD010
call = "DebrisFade"
on_true = 0xCD03D
on_false = 0xCD093

[[hook]]
at = 0xCD077
call = "DebrisSpin"
on_true = 0xCD088

# particles fade at their 60 fps speed (src/game/particles.cpp)
[[hook]]
at = 0xCD8BB
call = "ParticleColourStep"
on_true = 0xCD8DF

# a falling particle with no room falls with no floor (src/game/particles.cpp)
[[hook]]
at = 0xCD5BA
call = "ParticleWithoutRoom"
on_true = 0xCD73B

[[hook]]
at = 0xCD632
call = "ParticleWithoutRoom"
on_true = 0xCD73B

[[hook]]
at = 0xCD68A
call = "ParticleWithoutRoom"
on_true = 0xCD6A3

# a window's glass shards wait, fall and fade at their 60 fps speed (src/game/glass_shards.cpp)
[[hook]]
at = 0x1FC70
call = "GlassShardTimes"
on_true = 0x1FC7F

[[hook]]
at = 0x1FDD9
call = "GlassShardStep"
on_true = 0x1FE3F

[[hook]]
at = 0x1FE7A
call = "GlassShardAlpha"
on_true = 0x1FE80

# lasers wear a thrown bomb down at their 60 fps rate (src/game/bomb_damage.cpp)
[[hook]]
at = 0x22965
call = "BombLaserDamage"
on_true = 0x2298F

# argument locations in API order for functions a link time code generated library compiled with another
# convention: a register (eax ebx ecx edx esi edi ebp) or "stack" for the next stack slot, which the callee pops
[abi]
